# exp_zero_oeo_v2.yaml
# PhotonFlow zero-OEO v2: byte-faithful re-run of Stage-2 (which beat baseline
# at gap -0.0119), packaged as a new kernel so we can iterate knobs safely.
#
# Forward graph is strictly photon-native:
#   - MonarchLayer (Cayley-unitary MZI mesh)   input/output bookends
#   - WavelengthCodedTime + MonarchLinear + PPLNSigmoid + MonarchLinear (time MLP)
#   - PhotonFlowBlock with wavelength-coded additive cond_bias  (zero adaLN,
#     zero learnable gamma/beta)
#   - SaturableAbsorber (graphene waveguide tanh(alpha x)/alpha)
#   - DivisivePowerNorm (photodetector + microring feedback, pre-calibrated
#     SOA gain)
#
# 0 nn.Linear, 0 nn.SiLU, 0 SinusoidalTimeEmbedding in the inference forward.
#
# Kaggle kernel: hasinthakapiyumal/photonflow-zero-oeo-v2

experiment:
  name: exp_zero_oeo_v2
  description: "PhotonFlow zero-OEO v2 (Stage-2 recipe, clean 2-run kernel)"

model:
  type: photonflow
  # --- v17 architecture backbone ---
  in_dim: 784
  hidden_dim: 784
  num_blocks: 14
  time_dim: 256
  gate_init: 0.5
  adaln_init_std: 0.02
  adaln_bottleneck: 8
  num_monarch_factors: 1
  monarch_init: random
  depth_decay_residual: false
  absorber_alpha: 0.8
  absorber_leaky_slope: 0.05
  learnable_absorber_alpha: false
  mean_center_norm: false

  # --- Stage-0 mitigations (M2/M5/M8a/M9/M12) ---
  use_noise: true
  sigma_s: 0.001
  sigma_t: 0.005
  shot_signal_dependent: true
  absorber_intensity_mode: differential
  cumulative_loss_db_per_stage: 0.0003
  monarch_bias: false

  # --- Stage-1 GREEN kwargs (M1/M7/M8b) ---
  unitary_project: true
  proj_style: monarch
  phase_noise_sigma: 0.005

  # --- Stage-2 YELLOW kwargs (photonic SiLU + photonic MLPs) ---
  time_encoding: wavelength
  time_mlp_style: monarch
  adaln_proj_style: monarch
  final_adaln_style: monarch

data:
  dataset: mnist
  batch_size: 128
  root: ./data
  num_workers: 2

training:
  lr: 1.7e-3
  total_steps: 2000
  warmup_steps: 600
  lr_schedule: cosine
  grad_clip: 1.0
  checkpoint_every: 1000
  sample_every: 500
  sample_steps: 20
  seed: 42
  time_sampling: uniform
  direction_loss_weight: 0.0
  loss_weight_gamma: 0.0

ema:
  enabled: false
  decay: 0.9999

qat:
  enabled: false

output_dir: outputs/exp_zero_oeo_v2
